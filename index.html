<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impatiens — Seed Pod</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #fff;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 26px 38px;
    z-index: 100;
    pointer-events: none;
  }
  #header .title {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #000;
  }
  #header .subtitle {
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #000;
  }

  #footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    padding: 26px;
    z-index: 100;
    pointer-events: none;
  }
  #hint {
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #000;
    transition: opacity 0.8s ease;
  }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  /* clickable nav seeds drawn on separate overlay */
  #nav-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 30;
    pointer-events: none;
  }

  .nav-point {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .nav-point.live {
    pointer-events: auto;
    opacity: 1;
  }
  .nav-point .dot {
    width: 8px; height: 8px;
    background: #000;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    transition: width 0.38s cubic-bezier(0.4,0,0.2,1),
                height 0.38s cubic-bezier(0.4,0,0.2,1);
  }
  .nav-point .dot .dot-img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.28s ease 0.18s;
    display: block;
  }
  .nav-point:hover .dot {
    width: 500px;
    height: 500px;
  }
  .nav-point:hover .dot .dot-img {
    opacity: 1;
  }
  .nav-point .lbl {
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #000;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .nav-point.live .lbl { opacity: 1; }

  /* pod */
  #scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    /* nav seeds appended here will be absolute, but dot expansion uses transform */
  }
  #pod-wrap {
    position: relative;
    width: 210px; height: 270px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #pod-wrap.tense { transform: scale(1.05); transition: transform 0.3s ease; }
  #pod-wrap.burst {
    cursor: default;
    pointer-events: none;
    animation: pop 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.22); }
    65%  { transform: scale(1.10); }
    100% { transform: scale(1.13); opacity: 1; }
  }
  #pod-img {
    width: 100%; height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    display: block;
  }

  /* panel */
  #panel {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 200;
    pointer-events: none;
    background: #fff;
    clip-path: circle(0% at var(--ox, 50%) var(--oy, 50%));
    transition: clip-path 0.7s cubic-bezier(0.76, 0, 0.24, 1);
    overflow: hidden;
  }
  #panel.open {
    pointer-events: auto;
    clip-path: circle(150% at var(--ox, 50%) var(--oy, 50%));
  }

 .p-grid-bg {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 0;
  padding: 0;
}
.p-grid-cell {
  overflow: hidden;
  position: relative;
}
.p-grid-cell img {
  width: 110%;
  height: 110%;
  object-fit: cover;
  transform-origin: center;
  display: block;
  position: absolute;
  top: -5%;
  left: -5%;
}
.p-text-block {
  position: absolute;
  bottom: 6%;
  right: 5%;
  width: 52%;
 max-width: 1520px;
 background: transparent;
  padding: 16px;
  z-index: 10;
}
.p-text-inner {
  font-size: 40px;
  font-weight: 900;
  webkit-text-stroke: 1px #000;
  letter-spacing: -0.09em;
  text-transform: uppercase;
  line-height: 1.1;
  color: #000;
}

  #panel-close {
    position: fixed; top: 28px; right: 38px;
    font-size: 8px; font-weight: 900;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: #000; cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s ease 0.6s;
    z-index: 210;
  }
  #panel.open #panel-close { opacity: 1; }
  #panel-close:hover { opacity: 0.4; }
</style>
</head>

    title: "Bloom Time",
    body: "Flowers appear from midsummer through to the first frosts of autumn, typically June to October in temperate regions. The self-seeding habit ensures colonies return year after year. As pods ripen and tighten, even the gentlest touch releases them — scattering next season's generation across the surrounding earth.",
   textColor: "##FF0000",
   img: "bloom2.jpg"
  }
];

// ── elements ────────────────────────────────────────────
const podWrap  = document.getElementById('pod-wrap');
const podImg   = document.getElementById('pod-img');
const hint     = document.getElementById('hint');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const navLayer = document.getElementById('nav-layer');
const panel    = document.getElementById('panel');
const pClose   = document.getElementById('panel-close');

// ── canvas resize ────────────────────────────────────────
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

// ── state ────────────────────────────────────────────────
let state = 'closed';
let particles = [];
let navEls = [];
let animId = null;

// ── 5 nav seed "destiny" positions, spread wide ──────────
function getNavTargets() {
  const W = innerWidth, H = innerHeight;
  const cx = W / 2, cy = H / 2;
  return [
    { x: cx - W * 0.30, y: cy - H * 0.26 },
    { x: cx + W * 0.28, y: cy - H * 0.20 },
    { x: cx - W * 0.34, y: cy + H * 0.20 },
    { x: cx + W * 0.31, y: cy + H * 0.25 },
    { x: cx + W * 0.03, y: cy + H * 0.36 },
  ];
}

// ── hover ────────────────────────────────────────────────
podWrap.addEventListener('mouseenter', () => {
  if (state !== 'closed') return;
  state = 'tense';
  podImg.src = IMG_TENSE;
  podWrap.classList.add('tense');
  hint.textContent = 'release it';
});
podWrap.addEventListener('mouseleave', () => {
  if (state !== 'tense') return;
  state = 'closed';
  podImg.src = IMG_CLOSED;
  podWrap.classList.remove('tense');
  hint.textContent = 'touch to feel the tension';
});

// ── click / burst ────────────────────────────────────────
podWrap.addEventListener('click', () => {
  if (state === 'burst') return;
  state = 'burst';
  podWrap.classList.remove('tense');
  podImg.src = IMG_BURST;
  podWrap.classList.add('burst');
  hint.style.opacity = '0';

  const rect = podWrap.getBoundingClientRect();
  const ox = rect.left + rect.width  / 2;
  const oy = rect.top  + rect.height / 2;

  const navTargets = getNavTargets();

  // Build nav DOM elements (hidden for now)
  navEls = CONTENT.map((c, i) => {
    const el = document.createElement('div');
    el.className = 'nav-point';
    el.innerHTML = `<div class="dot"><img class="dot-img" src="${c.img}" alt=""></div><span class="lbl">${c.title}</span>`;
    el.style.left = navTargets[i].x + 'px';
    el.style.top  = navTargets[i].y + 'px';
    document.getElementById("scene").appendChild(el);
    el.addEventListener('click', () => openPanel(i, el));
    return el;
  });

  // Spawn regular particles
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 8;
    particles.push({
      x: ox + (Math.random() - 0.5) * 24,
      y: oy + (Math.random() - 0.5) * 24,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - Math.random() * 2.5,
      ay: 0.07 + Math.random() * 0.06,
      size: 1.5 + Math.random() * 3,
      alpha: 1,
      settled: false,
      isNav: false,
    });
  }

  // Spawn 5 nav particles — they fly toward their destiny target
  navTargets.forEach((target, i) => {
    const angle = Math.atan2(target.y - oy, target.x - ox);
    const dist  = Math.hypot(target.x - ox, target.y - oy);
    // Travel time ~1.8s at ~60fps → ~108 frames
    // We'll use a homing approach: store target
    particles.push({
      x: ox + (Math.random() - 0.5) * 20,
      y: oy + (Math.random() - 0.5) * 20,
      vx: Math.cos(angle) * (dist / 90),
      vy: Math.sin(angle) * (dist / 90) - 1.5,
      ay: 0.04,
      size: 4,
      alpha: 1,
      settled: false,
      isNav: true,
      navIndex: i,
      targetX: target.x,
      targetY: target.y,
      homing: false,  // starts ballistic, then homes
      homingFrames: 0,
    });
  });

  cancelAnimationFrame(animId);
  loop();
});

// ── animation loop ───────────────────────────────────────
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let allDone = true;

  for (const p of particles) {
    if (p.settled) {
      // draw settled dot (nav ones are invisible on canvas — shown via DOM)
      if (!p.isNav) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.85, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(17,17,17,0.38)';
        ctx.fill();
      }
      continue;
    }

    allDone = false;

    if (p.isNav) {
      // Phase 1: ballistic for ~40 frames, then home
      p.homingFrames++;
      if (p.homingFrames > 38) { p.homing = true; }

      if (p.homing) {
        // Ease toward target
        p.vx += (p.targetX - p.x) * 0.055;
        p.vy += (p.targetY - p.y) * 0.055;
        p.vx *= 0.78;
        p.vy *= 0.78;
      } else {
        p.vx *= 0.97;
        p.vy *= 0.97;
        p.vy += p.ay;
      }

      p.x += p.vx;
      p.y += p.vy;

      const dx = p.x - p.targetX;
      const dy = p.y - p.targetY;
      if (p.homing && Math.hypot(dx, dy) < 1.2 && Math.hypot(p.vx, p.vy) < 0.5) {
        p.x = p.targetX;
        p.y = p.targetY;
        p.settled = true;
        // Reveal nav DOM element
        const el = navEls[p.navIndex];
        el.classList.add('live');
      }

      // Draw as slightly larger nav seed while flying
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(17,17,17,0.92)';
      ctx.fill();

    } else {
      // Regular particle
      p.vx *= 0.972;
      p.vy *= 0.972;
      p.vy += p.ay;
      p.x  += p.vx;
      p.y  += p.vy;

      // floor
      if (p.y > canvas.height - 16) {
        p.y = canvas.height - 16;
        p.vy *= -0.12;
        p.vx *= 0.65;
      }

      if (Math.abs(p.vx) < 0.06 && Math.abs(p.vy) < 0.18) {
        p.settled = true;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(17,17,17,0.88)';
      ctx.fill();
    }
  }

  if (!allDone) {
    animId = requestAnimationFrame(loop);
  } else {
    // Final settled render
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
      if (!p.isNav) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.85, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(17,17,17,0.35)';
        ctx.fill();
      }
    }
  }
}

// ── panel ────────────────────────────────────────────────
function openPanel(i, originEl) {
  const grid = document.getElementById('p-grid-bg');
  grid.innerHTML = '';

  for (let c = 0; c < 20; c++) {
    const cell = document.createElement('div');
    cell.className = 'p-grid-cell';
    const img = document.createElement('img');
    img.src = CONTENT[i].img;
    const rot = (Math.random() - 0.5) * 8;
    const sc = 1.1 + Math.random() * 0.8;
    img.style.transform = `rotate(${rot}deg) scale(${sc})`;
    cell.appendChild(img);
    grid.appendChild(cell);
  }

  document.getElementById('p-title-block').innerHTML = `
  CROW IMPATIENS<br>
  ${CONTENT[i].title}<br><br>
  ${CONTENT[i].body}
  `;
document.getElementById('p-title-block').style.color = CONTENT[i].textColor || '#000';
document.querySelector('.p-text-block').style.background = CONTENT[i].bgColor || 'transparent';


  const rect = originEl.querySelector('.dot').getBoundingClientRect();
  const ox = ((rect.left + rect.width / 2) / window.innerWidth * 100).toFixed(2) + '%';
  const oy = ((rect.top + rect.height / 2) / window.innerHeight * 100).toFixed(2) + '%';
  panel.style.setProperty('--ox', ox);
  panel.style.setProperty('--oy', oy);
  panel.getBoundingClientRect();
  panel.classList.add('open');
}
function closePanel() {
  panel.classList.remove('open');
}

pClose.addEventListener('click', closePanel);
panel.addEventListener('click', e => { if (e.target === panel) closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
</html>
